# This workflow deploys the site from the main branch when content changes.

name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - content/**
      - mkdocs.yml
  workflow_dispatch:

jobs:
  deploy:
    # This builds the site itself, including the aforementioned PDFs, and uploads it to production.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --no-dev

      - name: Create output directory.
        run: mkdir -p output

      - name: Set changed policy filepaths.
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="${after}^"
            fi
            filepaths=$(git diff --name-only --diff-filter=ACMR "$before" "$after" -- content/policies | grep -vE '^content/policies/[^/]+/index\.md$' | paste -sd, -)
            deleted=$(git diff --name-only --diff-filter=D "$before" "$after" -- content/policies | grep -vE '^content/policies/[^/]+/index\.md$' | paste -sd, -)
          else
            filepaths=$(find content/policies -mindepth 3 -name '*.md' | paste -sd, -)
            deleted=""
          fi
          echo "filepaths=$filepaths" >> "$GITHUB_OUTPUT"
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"

      - name: Build and Upload Policy PDFs
        if: steps.changed.outputs.filepaths != ''
        env:
          UPLOAD_PDFS: "true"
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
        run: |
          uv run boardify pdf --upload "${{ steps.changed.outputs.filepaths }}"

      - name: Delete Removed Policy PDFs
        if: steps.changed.outputs.deleted != ''
        env:
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
        run: |
          uv run boardify delete-pdf --base "${{ github.event.before }}" "${{ steps.changed.outputs.deleted }}"

      - name: Build Site
        run: uv run mkdocs build --site-dir site

      - name: Upload Site Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
