# On demand: change the title of the policy a work-in-progress branch is changing. In "Use workflow from"
# pick that branch (it must already contain this file, so update it from main first) and enter the new title.
# It updates the Policy and its Regulation (their titles must stay identical), renames the folder to
# <code>-<new-title-slug> with git mv (so the old URL stops working), runs `boardify check`, and commits
# the change to that branch, so the branch's open pull request picks it up.
# The policy is the one the branch changes against main; it stops if that is not exactly one policy.
# A push made with the default token does not start other workflows: close and reopen the pull
# request once to re-run Draft PDFs and the trustee sign-off gate.
# For a policy already on main, the deploy replaces the old-title PDF in S3 once the change is merged.
name: Rename policy

on:
  workflow_dispatch:
    inputs:
      title:
        description: New title
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rename-policy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      # Inputs are data, never interpolated into shell.
      BRANCH: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NEW_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Change the title
        id: rename
        run: |
          uv run python - <<'PY'
          import glob, json, os, re, subprocess, sys

          if os.environ["BRANCH"] == os.environ["DEFAULT_BRANCH"]:
              sys.exit("Run this from the branch holding the policy (Use workflow from), not from the default branch")
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"origin/{os.environ['DEFAULT_BRANCH']}...HEAD", "--", "content/policies"],
              capture_output=True, text=True, check=True).stdout.split("\n")
          codes = sorted({m.group(1) for f in changed
                          if (m := re.match(r"content/policies/[^/]+/(\d{4}-\d{2})-[^/]+/(?:index|regulation)\.md$", f))})
          if len(codes) != 1:
              sys.exit(f"This branch changes {len(codes)} policies ({', '.join(codes) or 'none'}); it must change exactly one")
          code = codes[0]
          new = " ".join(os.environ["NEW_TITLE"].split())
          if not new:
              sys.exit("The new title is empty")

          files = sorted(glob.glob(f"content/policies/*/{code}-*/index.md")
                         + glob.glob(f"content/policies/*/{code}-*/regulation.md"))
          if not any(f.endswith("/index.md") for f in files):
              sys.exit(f"No policy with code {code}")

          # Plain YAML when safe, otherwise a double-quoted scalar (JSON strings are valid YAML).
          value = new if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9 ,()._/-]*", new) else json.dumps(new)
          old = None
          for path in files:
              text = open(path, encoding="utf-8").read()
              m = re.match(r"---\n(.*?)\n---\n", text, re.S)
              head = m.group(1)
              t = re.search(r"^title:[ \t]*(.*)$", head, re.M)
              if old is None:
                  old = t.group(1).strip().strip("\"'")
              head = head[:t.start()] + f"title: {value}" + head[t.end():]
              open(path, "w", encoding="utf-8").write(f"---\n{head}\n---\n" + text[m.end():])
              print("updated", path)

          if old == new:
              sys.exit(f"{code} is already titled '{new}'")

          # The folder is <code>-<slug>: move it so the path follows the title.
          slug = re.sub(r"[^a-z0-9]+", "-", new.lower()).strip("-")
          folder = os.path.dirname(files[0])
          target = os.path.join(os.path.dirname(folder), f"{code}-{slug}")
          if target != folder:
              if os.path.exists(target):
                  sys.exit(f"{target} already exists")
              subprocess.run(["git", "mv", folder, target], check=True)
              print("moved", folder, "->", target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"code={code}\n")
          PY

      - name: Validate
        run: |
          uv run boardify check
          uv run boardify cms-config --check

      - name: Commit to the branch
        env:
          CODE: ${{ steps.rename.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/policies
          git commit -m "Rename $CODE to $NEW_TITLE"
          git push origin "HEAD:refs/heads/$BRANCH"
