# On a pull request: validate the content, build draft PDFs and a redline packet as an artifact.
# Copy to .github/workflows/draft-pdfs.yml in a content repo.
name: Draft PDFs

on:
  pull_request:
    paths:
      - content/**

permissions:
  contents: read
  pull-requests: read   # gh pr view / gh pr diff use GraphQL

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.number }}
      TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --no-dev

      # Validation must not stop the draft PDFs: a Regulation PR fails `boardify check` until its
      # Policy PR merges, but reviewers still need its PDF. The failure is reported by the last step.
      - name: Validate content
        id: validate
        continue-on-error: true
        run: uv run boardify check

      - name: List changed policy files
        run: |
          gh pr view "$PR_NUMBER" --json files \
            | jq -j '.files[] | select(.changeType != "DELETED" and (.path | endswith(".md"))) | .path + "\u0000"' \
            > "$RUNNER_TEMP/changed.z"

      - name: Build draft PDFs
        run: xargs -0 -r uv run boardify pdf < "$RUNNER_TEMP/changed.z"

      - name: Build redlines
        run: |
          mkdir -p output
          gh pr diff "$PR_NUMBER" > output/diff.diff
          uv run boardify diff
          uv run boardify redline
          rm output/diff.*

      # Optional, with meeting-snapshot.yml: the newest meeting tag that lists this pull request holds the
      # commit that was presented. Redline the changed files against it. File contents are compared, not
      # the commit range, so a merge of main into the branch does not show up as edits.
      - name: Build redlines since the last meeting
        run: |
          tag=$(git tag -l 'meeting/*' --sort=-refname | while read -r t; do
            if git tag -l --format='%(contents)' "$t" | awk -v n="pr-$PR_NUMBER" '$1 == n { found = 1 } END { exit !found }'; then
              echo "$t"; break
            fi
          done)
          if [ -z "$tag" ]; then
            echo "No meeting tag lists this pull request; only the cumulative redline is built."
            exit 0
          fi
          sha=$(git tag -l --format='%(contents)' "$tag" | awk -v n="pr-$PR_NUMBER" '$1 == n { print $2; exit }')
          if ! git cat-file -e "$sha^{commit}" 2> /dev/null && ! git fetch -q origin "$sha"; then
            echo "::warning::Could not fetch $sha from $tag; skipping the redline since the last meeting."
            exit 0
          fi
          mkdir -p output
          xargs -0 -r git diff --no-renames "$sha" "$HEAD_SHA" -- < "$RUNNER_TEMP/changed.z" > output/since.diff
          uv run boardify diff --diff-file output/since.diff --json output/since.json --since "Changes since meeting ${tag#meeting/}"
          uv run boardify redline --json output/since.json --suffix _since-meeting
          rm output/since.*

      # Artifact names cannot contain : " < > | * ? \ / or line breaks, which PR titles often do.
      - name: Name the artifact after the PR title
        id: artifact
        run: |
          name=$(printf '%s' "$TITLE" | tr -c 'A-Za-z0-9._ -' '-' | cut -c1-100)
          echo "name=${name:-draft-pdfs}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: output

      - name: Fail the check if validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::Validation failed (see the 'Validate content' step). The draft PDFs above were still built and uploaded."
          exit 1
