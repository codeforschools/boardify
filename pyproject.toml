[project]
name = "boardify"
version = "0.1.0"
description = "Tooling for policy-manual sites: structure checks, PDFs and redlines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "boto3",
    "Jinja2",
    "mistune",
    "python-frontmatter",
    "unidiff",
    "weasyprint",
]

[project.scripts]
boardify = "boardify.cli:main"

[project.entry-points."mkdocs.themes"]
boardify = "boardify_theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardify", "src/boardify_theme"]
